[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  # firebase-admin se instala tal cual en lugar de empaquetarlo (evita problemas con esbuild)
  external_node_modules = ["firebase-admin"]

# El service worker no debe quedarse en caché, para que las actualizaciones lleguen enseguida
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
